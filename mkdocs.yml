site_name: AOBench
site_description: "AOBench: A Trace-Driven, Role-Aware Benchmark for Agent Operations in Realistic Environments"
site_url: https://mskazemi.com/aobench/
repo_url: https://github.com/MSKazemi/aobench
repo_name: MSKazemi/aobench
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.instant
    - search.highlight
    - content.tabs.link
    - navigation.top
    - content.action.edit
    - announce.dismiss

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

plugins:
  - search
  - include-markdown
  - social
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - admonition
  - toc:
      permalink: true
  - md_in_html

extra:
  version:
    provider: mike
  analytics:
    provider: google
    property: G-XXXXXXXXXX

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart: getting-started/quickstart.md
    - Installation & Running: getting-started/installation.md
  - Framework:
    - Documentation Map: framework/index.md
    - Overview: framework/overview.md
    - Background: framework/background.md
    - Architecture: framework/architecture.md
    - Paper Architecture: framework/paper-architecture.md
    - Environments: framework/environments.md
    - Evaluation: framework/evaluation.md
  - Tutorials:
    - Serve the Benchmark (REST & MCP): tutorials/serving-the-benchmark.md
  - Guides:
    - Evaluate Your Own Agent: guides/evaluating-your-own-agent.md
    - Adapters & Tools: guides/adapters-and-tools.md
    - CI Integration: guides/ci-integration.md
    - Programmatic Access (REST & MCP): guides/programmatic-access.md
    - Langfuse Integration: guides/langfuse-integration.md
    - Marconi100 ExaData Environments: guides/m100_environments.md
  - Leaderboard: leaderboard.md
  - Reference:
    - CLI Commands: reference/commands.md
    - Task Catalog: reference/task-catalog.md
    - Environment Catalog: reference/environment-catalog.md
    - Scoring Dimensions: framework/scoring-dimensions.md
    - Taxonomy: framework/taxonomy.md
    - Glossary: reference/glossary.md
    - System Architecture: reference/system-architecture.md
    - Architecture Flowchart: reference/architecture-flowchart.md
    - Environments Overview: reference/environments-overview.md
  - Contributing:
    - How to Contribute: about/contributing.md
    - Developer Guide: framework/implementation.md
  - About:
    - FAQ: about/faq.md
    - Use Cases: about/use-cases.md
    - Limitations: about/limitations.md
    - Comparison to Other Benchmarks: about/comparison.md
    - Related Work: about/related-work.md
    - Benchmark Card: about/benchmark-card.md
    - Datasheet: about/datasheet.md
    - Ethics: about/ethics.md
    - Versioning Policy: about/versioning.md
    - Cite AOBench: about/citation.md
    - Reproducing Results: about/reproducing-results.md
    - Changelog: about/changelog.md
    - Security: about/security.md
