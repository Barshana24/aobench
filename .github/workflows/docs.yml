name: Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

# Both the push-to-main and the tag push trigger this workflow, and both deploy to
# gh-pages. Without serialisation they race and one loses ("failed to push some refs").
# Queue them instead of cancelling — a cancelled deploy would leave docs half-published.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        # See ci.yml — setup-uv publishes no major tag beyond v7, so pin the
        # immutable release tag.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Configure git for mike
        run: |
          git config user.name "Mohsen Seyedkazemi Ardebili"
          git config user.email "mohsen.seyedkazemi@gmail.com"

      - name: Deploy current version (on push to main / manual dispatch)
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          uv run mike deploy --push --update-aliases "$VERSION" latest

      - name: Deploy version + update latest (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          uv run mike deploy --push --update-aliases "$VERSION" latest

      - name: Set default version to latest
        run: uv run mike set-default --push latest

      # Discovery files are only useful at a path a crawler will actually try.
      # mike publishes docs under /aobench/<version>/, so anything in docs/ lands at
      # /aobench/latest/<file> while the discoverable /aobench/<file> 404s. Crawlers
      # try the un-versioned path, and robots.txt advertises the un-versioned sitemap
      # URL, so all four are copied to the gh-pages root.
      #
      # Note on robots.txt: a crawler only honours it at the HOST root
      # (https://mskazemi.com/robots.txt, owned by the mskazemi.github.io repo).
      # The copy here is documentation of intent and a correct file should the docs
      # ever be served from their own host — it is not what controls crawling today.
      - name: Publish discovery files at the docs root
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/ghp gh-pages
          cp docs/llms.txt      /tmp/ghp/llms.txt
          cp docs/llms-full.txt /tmp/ghp/llms-full.txt
          cp docs/robots.txt    /tmp/ghp/robots.txt
          # The sitemap is generated, not authored. Take it from the version mike just
          # published so the root copy lists exactly the URLs whose pages carry the
          # matching canonical tag — a sitemap and a canonical that disagree is a worse
          # signal than no sitemap at all.
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ -f "/tmp/ghp/$VERSION/sitemap.xml" ]; then
            cp "/tmp/ghp/$VERSION/sitemap.xml" /tmp/ghp/sitemap.xml
          else
            echo "::warning::no sitemap at /tmp/ghp/$VERSION/sitemap.xml — root sitemap not refreshed"
          fi
          git -C /tmp/ghp add llms.txt llms-full.txt robots.txt sitemap.xml
          if git -C /tmp/ghp diff --cached --quiet; then
            echo "discovery files unchanged — nothing new to commit"
          else
            git -C /tmp/ghp \
                -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "docs: publish llms.txt, llms-full.txt, robots.txt, sitemap.xml at the docs root"
          fi
          # Push from the MAIN worktree, never from /tmp/ghp. actions/checkout v6+ no
          # longer writes the token into .git/config; it injects it via
          #   includeIf.gitdir:<repo>/.git.path = $RUNNER_TEMP/git-credentials-*.config
          # and that condition does NOT match a linked worktree's gitdir
          # (<repo>/.git/worktrees/ghp), so a push issued from inside /tmp/ghp is
          # unauthenticated. Refs are shared between worktrees, so the commit made above
          # is pushed from here. Running the push unconditionally also means a broken
          # token fails the run immediately instead of lying dormant until the next time
          # llms.txt happens to change.
          git push origin gh-pages
