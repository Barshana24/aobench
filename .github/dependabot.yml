version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "type: tech-debt"
      - "area: infra"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for routine patch/minor bumps instead of a flood of individual ones.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "type: tech-debt"
      - "area: infra"
    commit-message:
      prefix: "chore(actions)"
